name: Windows Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies (vcpkg)
      run: vcpkg install sqlite3:x64-windows nlohmann-json:x64-windows
      
    - name: Configure CMake
      # The GitHub runner automatically provides the VCPKG_INSTALLATION_ROOT variable
      run: >
        cmake -B build -S . 
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload Artifact (Binary)
      uses: actions/upload-artifact@v4
      with:
        name: BackupIntegrityChecker-Windows-x64
        path: build/Release/backup_integrity_checker.exe
        if-no-files-found: error
