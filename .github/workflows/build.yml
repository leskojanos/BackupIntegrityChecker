name: Auto Release on Tag

on:
  push:
    tags:
      - 'v*' # Lefut minden v0.1, v1.0 stb. tag beküldésekor

jobs:
  build_and_release:
    name: Build and Release on Windows
    runs-on: windows-latest
    
    # Kötelező írási jog a Release létrehozásához
    permissions:
      contents: write 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies (vcpkg)
      run: vcpkg install sqlite3:x64-windows nlohmann-json:x64-windows
      
    - name: Configure CMake
      run: >
        cmake -B build -S . 
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

    - name: Build Project
      run: cmake --build build --config Release

    - name: Projekt és forráskód becsomagolása ZIP-be
      # PowerShell parancsok a dinamikus fájlnevek generálásához
      run: |
        # 1. A lefordított exe fájl becsomagolása
        Compress-Archive -Path build\Release\backup_integrity_checker.exe -DestinationPath backup_integrity_checker_${{ github.ref_name }}_binary.zip
        
        # 2. A tiszta forráskód becsomagolása egyedi néven
        Compress-Archive -Path "include", "src", "CMakeLists.txt", "README.md", "build.bat" -DestinationPath backup_integrity_checker_${{ github.ref_name }}_source.zip

    - name: GitHub Release létrehozása és aszet feltöltése
      uses: softprops/action-gh-release@v1
      with:
        # Mindkét egyedileg elnevezett fájlt feltöltjük
        files: |
          backup_integrity_checker_${{ github.ref_name }}_binary.zip
          backup_integrity_checker_${{ github.ref_name }}_source.zip
        name: "Backup Integrity Checker ${{ github.ref_name }}"
        body: |
          ### Automatikus kiadás
          - **Verzió:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
